name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test bounded source decoding
        run: swift test
      - name: Test installer safeguards and rollback
        run: python3 -m unittest discover -s Tests/InstallerTests -v
      - name: Build and verify the universal app
        run: python3 build.py --arch universal
